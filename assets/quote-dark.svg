<svg xmlns="http://www.w3.org/2000/svg" width="828" height="132" viewBox="0 0 828 132" role="img" aria-labelledby="ttl">
<title id="ttl">The details are not the details. They make the design. — Charles Eames</title>
<defs></defs>
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans","PingFang SC","Hiragino Sans","Helvetica Neue",Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
.serif{font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Songti SC","Noto Serif CJK SC","Source Han Serif SC",serif}
.fade{animation:fade .9s ease-out both}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .fade{animation:none}
  .typed{clip-path:none!important}
  .typed:not(.p0){display:none!important}
  .caret,.pulse{display:none!important}
}
</style>
<rect x="0.5" y="0.5" width="827" height="131" rx="18" fill="#151412" stroke="#2a2722"/>
<g fill="none">
<text x="414" y="56" class="serif" font-size="40" fill="#ff6b3d" text-anchor="middle" opacity="0.9">“</text><text x="414" y="76" class="serif" font-size="17" fill="#f1ede5" text-anchor="middle" font-style="italic">The details are not the details. They make the design.</text><text x="414" y="104" class="mono" font-size="9.5" fill="#8c857a" letter-spacing="1.6" text-anchor="middle">— Charles Eames</text>
</g>
</svg>
