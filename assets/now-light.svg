<svg xmlns="http://www.w3.org/2000/svg" width="828" height="112" viewBox="0 0 828 112" role="img" aria-labelledby="ttl">
<title id="ttl">Local time and a quote</title>
<defs></defs>
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans","PingFang SC","Hiragino Sans","Helvetica Neue",Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
@media (prefers-reduced-motion:reduce){
  .typed{clip-path:none!important}
  .typed:not(.p0){display:none!important}
  .caret{display:none!important}
}
</style>
<g fill="none">
<rect x="0" y="0" width="828" height="1" fill="#e8e8e8"/><text x="0" y="32" class="mono" font-size="9" fill="#b4b4b4" letter-spacing="1.6">TOKYO · LOCAL TIME</text><text x="0" y="74" class="mono" font-size="26" fill="#111111">00:33</text><text x="0" y="96" class="mono" font-size="9.5" fill="#b4b4b4" letter-spacing="1.2">SAT, 31 OCT 2026</text><text x="828" y="58" class="sans" font-size="14" fill="#3d3d3d" text-anchor="end" font-style="italic">“静水流深。”</text><text x="828" y="82" class="mono" font-size="9" fill="#b4b4b4" letter-spacing="1.2" text-anchor="end">— 汉语谚语</text>
</g>
</svg>
